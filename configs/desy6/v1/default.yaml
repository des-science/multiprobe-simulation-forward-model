# DES Y6 forward model, version 1. SKELETON (2026-11-18): msfm cannot run it until the Y6 code changes are in and
# the last two data/desy6/ products exist (files.metacal_systematics and files.metacal_bias).
#
# Base: configs/desy3/v18/default.yaml. Every key without a marker keeps its v18 value on purpose; that includes
# the shape-noise model (count, with the imaging systematics imprinted on the source density).
# The Y6 products and values come from `python -m msfm.apps.products.desy6 <step>` (data/desy6/README.md). Markers:
#   # <- step <name>                   that step writes the file
#   # <- desy6 values: <dotted.key>    the step `config` writes this value from files.survey_values; do not edit
#                                      it by hand (`config --check` catches a stale value)
#   OPEN: ...                          a modelling choice still to be made for Y6
dirs:
  # the public Y6 release as downloaded by Tomasz, read in place. Used: metadetect_2024-11-07.hdf5,
  # maglim_2024-11-07.hdf5, jointmask_DESY6_2024-06-04.hsp, 3x2pt_2025-07-28-20h_UNBLINDED_wmask_nob2.fits,
  # desy6_source_redshift.h5 (m columns only)
  catalog: /capstor/store/cscs/userlab/lp184/tomaszk/261109_cosmogridv1_desy6/data_desy6a2
  # relative to the root of this repository
  redshift_distributions: data/desy6/redshift_distributions # <- step nz
  # catalog maps of every survey bin and the source response, gitignored
  cache: data/desy6/cache # <- step maps

files:
  # relative to the root of this repository
  pixels: data/desy6/desy6_pixels_fiducial_512.h5 # <- step pixels
  noise: data/desy6/desy6_noise_512.h5 # <- step noise
  # inputs, outputs and msfm commit of every product step
  provenance: data/desy6/provenance.yaml
  # the data-derived values, per bin label; step config writes them into the lines marked "desy6 values"
  survey_values: data/desy6/desy6_survey_values.yaml # <- step values
  # survey-agnostic: the only inputs shared with Y3
  meta_info: data/CosmoGridV1_metainfo.h5
  healpy_data: data/healpy_data
  # Y6 imaging systematics of the sources, from an lss_sys run on the Y6 survey-property maps (not downloaded yet).
  # The lss_sys run label goes into the name, as for Y3
  metacal_systematics: data/desy6/desy6_metacal_systematics_512.h5
  # source clustering bias, fit against this forward model on the Y6 projection
  metacal_bias: data/desy6/desy6_metacal_bias.h5 # <- step sc_bias
  metacal_bias_arm: contam

survey:
  name: DESy6
  # the metadetection sources; "metacal" is msfm's key for the source role
  metacal:
    map_types:
      input: [kg, ia, dg, dg]
      output: [kg, ia, sn, ds]
    # the labels of the Y6 test projection. OPEN: distinct Y6 labels
    z_bins: [metacal1, metacal2, metacal3, metacal4]
    # in galaxies/deg^2, inside the nside-512 mask
    n_gal: [7433.825377591532, 7635.582963085136, 7677.574950556799, 8182.75987826189] # <- desy6 values: survey.metacal.n_gal
    # mean and std of M_BIN1-4 in desy6_source_redshift.h5. Only until m is read from the projection
    shear_bias:
      multiplicative:
        mu: [-0.003397673790742481, 0.00645519707938863, 0.015939349904159923, 0.001698109169479922] # <- desy6 values: survey.metacal.shear_bias.multiplicative.mu
        sigma: [0.005784359495438698, 0.006623822114448156, 0.005938030766082593, 0.01220024598003775] # <- desy6 values: survey.metacal.shear_bias.multiplicative.sigma
    # IA pivot redshift, v18's. OPEN: the KP uses 0.3
    z0: 0.62
    # metadetection response per bin, replaces R_gamma + R_s. DES: 0.856143, 0.868506, 0.819427, 0.691769
    response: [0.8561433330298941, 0.868505678503587, 0.8194268015985411, 0.6917685743283779] # <- desy6 values: survey.metacal.response
  # MagLim. The KP drops survey bin 2, so these are survey bins 1, 3, 4, 5, 6
  maglim:
    map_types:
      input: [dg]
      output: [dg]
    z_bins: [maglim1, maglim3, maglim4, maglim5, maglim6]
    # weighted, in galaxies/deg^2, inside the nside-512 mask
    n_gal: [406.3791156368063, 310.350946760715, 391.5827112999988, 305.6365876349676, 309.63682162262666] # <- desy6 values: survey.maglim.n_gal
    # no z_lims: the Y6 catalog is already binned (tomo_bin_k)
  # in deg^2, the joint mask at nside 131072, as in DES's 3x2pt_pipeline_public.ipynb (4031.036)
  Aeff: 4031.03590997686 # <- desy6 values: survey.Aeff

analysis:
  n_side: 512
  n_pix: 3145728
  # minimal n_side_for the networks, determines the padding of the data vectors
  n_side_down: 16
  # number of cut outs from the full sky
  n_patches: 4
  # the six cosmological parameters of the CosmoGrid have to be listed first
  params:
    # same ordering as in the CosmoGrid
    cosmo: [Om, s8, Ob, H0, ns, w0]
    bary: [bary_Mc, bary_nu]
    # NLA model + first term of TATT (cross term). OPEN: the KP's IA model and priors
    ia:
      nla: [Aia, n_Aia]
      tatt: [bta]
    # galaxy biasing, named by survey bin. OPEN: whether downstream accepts these names
    bg:
      linear: [bg1, bg3, bg4, bg5, bg6]
      quadratic: [bg1_q, bg3_q, bg4_q, bg5_q, bg6_q]
      stochasticity: [rg]
  footprint:
    # REUSED from configs/desy3/v18/default.yaml (a choice). Step pixels asserts that the four rotated Y6 patches
    # do not overlap; new angles are chosen only if that fails
    rotation:
      y_rad: -0.125
      z_rad: -1.22
    # fraction of an nside-512 pixel the joint mask must cover to enter the footprint (step pixels). Chosen as in Y3
    # (0.72 there), so the footprint area matches the mask area: 0.73 gives +0.6% (step pixels logs the exact value)
    coverage_threshold: 0.73
  # All angles are in arcmin. Only l_min = 30 is baked into the .tfrecords; the smoothing scales come later.
  scale_cuts:
    hard_cut: True
    lensing:
      l_min: [30, 30, 30, 30]
      # healpy default of 3 * n_side - 1, since smoothing is done on the fly
      l_max: Null
      theta_fwhm: Null
    clustering:
      l_min: [30, 30, 30, 30, 30]
      # healpy default of 3 * n_side - 1, since smoothing is done on the fly
      l_max: Null
      theta_fwhm: Null
  modelling:
    baryonified: True
    store_cross_maps: False
    # degrade the maps to Gaussian Random Fields for testing and comparison to the power spectra
    degrade_to_grf: False
    lensing:
      store: True
      # shape-noise model (parsed/validated by files.get_shape_noise)
      shape_noise:
        # in_place (rotate galaxies in place) | gatti (calibrated density modulation) | count (Poisson resampling)
        method: count
        # fixed (per-cosmology bias from files.metacal_bias) | prior (b_sc sampled from the Latin hypercube)
        bias: fixed
        # imprint files.metacal_systematics on the source density before the resampling
        survey_systematics: True
      # whether to include the TATT cross-term on top of NLA
      extended_nla: True
      nla:
        truncate_nz: True
        z_min_quantile: 0.05
        z_max_quantile: 0.95
    clustering:
      store: True
      power_law_biasing: False
      per_bin_biasing: True
      # in addition to linear biasing
      quadratic_biasing: False
      # whether to include a stochasticity in the galaxy biasing. This scales the [-pi, pi] interval from which the
      # random phases with which the alm coefficients are multiplied are drawn. Set to Null to discard.
      stochasticity: False
      # the MagLim weights are per galaxy in Y6, so there are no survey systematics maps to apply
      maglim_survey_systematics_map: False
  normalization:
    lensing: [1, 1, 1, 1]
    clustering: [1, 1, 1, 1, 1]
  power_spectra:
    l_min: 30
    l_max: 1500
    n_bins: 33
  grid:
    # CosmoGrid
    n_cosmos: 2500
    n_perms_per_cosmo: 20
    n_noise_per_signal: 5
    priors:
      # from Table 1 in https://arxiv.org/pdf/2201.07771
      Om: [0.1, 0.5]
      s8: [0.4, 1.4]
      S8: [0.23094010767585035, 1.8073922282301278]
      H0: [64, 82]
      Ob: [0.03, 0.06]
      ns: [0.87, 1.07]
      w0: [-2, -0.333]
      # baryons
      bary_Mc: [12.0, 15.0]
      bary_nu: [-2, 2.0]
      # intrinsic alignment. OPEN: the KP priors
      Aia: [-3, 3.0]
      n_Aia: [-4, 6.0]
      bta: [0.0, 2.0]
      # galaxy clustering
      bg1: [0.8, 3.0]
      bg3: [0.8, 3.0]
      bg4: [0.8, 3.0]
      bg5: [0.8, 3.0]
      bg6: [0.8, 3.0]
      rg: [0.6, 1.0]
      Om_s8_border_points:
        [
          [0.1, 1.4],
          [0.2, 1.4],
          [0.5, 0.65],
          [0.5, 0.4],
          [0.3, 0.4],
          [0.1, 0.9],
        ]
  fiducial:
    # CosmoGrid. There is no Y6 fiducial projection yet
    n_cosmos: 17 # 1 + 2 * n_perts
    n_perms_per_cosmo: 1000
    n_noise_per_signal: 10
    # from Table 1 in https://arxiv.org/pdf/2201.07771
    Om: 0.26
    s8: 0.84
    S8: 0.7819974424510607
    H0: 67.36
    Ob: 0.0493
    ns: 0.9649
    w0: -1
    # baryons
    bary_Mc: 13.82
    bary_nu: 0.0
    # intrinsic alignment. OPEN: the KP fiducial values
    Aia: 0.5
    n_Aia: 1.5
    bta: 0.0
    # galaxy clustering (corresponds to bg=1.5, n_bg=0.5)
    bg1: 1.3460011
    bg3: 1.5010278
    bg4: 1.5707155
    bg5: 1.6251594
    bg6: 1.6702148
    rg: 0.8
    perturbations:
      Om: 0.01
      s8: 0.015
      H0: 2.0
      Ob: 0.001
      ns: 0.02
      w0: 0.05
      bary_Mc: 0.1
      bary_nu: 0.1
      Aia: 0.1
      n_Aia: 0.2
      bta: 0.1
      bg1: 0.1
      bg3: 0.1
      bg4: 0.1
      bg5: 0.1
      bg6: 0.1
